<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Contact — Last Seen Dreaming</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <div class="nav-blur"></div>
  <div class="bottom-blur"></div>
  <nav class="nav">
    <a href="index.html" class="nav-link">Home</a>
    <a href="projects.html" class="nav-link">Projects</a>
    <a href="contact.html" class="nav-link">Contact</a>
  </nav>

  <section class="contact-page">
    <img src="assets/cloud-bg-1.png" alt="" class="contact-cloud">
    <a href="mailto:inbox@lastseendreaming.com" class="contact-email">inbox@lastseendreaming.com</a>
  </section>

  <script>
    if (window.innerWidth > 768) {
      let current = window.scrollY, target = window.scrollY, raf;
      const lerp = (a, b, t) => a + (b - a) * t;
      window.addEventListener('wheel', e => { e.preventDefault(); target += e.deltaY; target = Math.max(0, Math.min(target, document.body.scrollHeight - window.innerHeight)); }, { passive: false });
      (function update() { current = lerp(current, target, 0.08); if (Math.abs(current - target) > 0.5) window.scrollTo(0, current); raf = requestAnimationFrame(update); })();
    }
  </script>
</body>
</html>
