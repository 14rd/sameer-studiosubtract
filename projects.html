  <script>
    if (window.innerWidth > 768) {
      let current = window.scrollY, target = window.scrollY, raf;
      const lerp = (a, b, t) => a + (b - a) * t;
      window.addEventListener('wheel', e => { e.preventDefault(); target += e.deltaY; target = Math.max(0, Math.min(target, document.body.scrollHeight - window.innerHeight)); }, { passive: false });
      (function update() { current = lerp(current, target, 0.08); if (Math.abs(current - target) > 0.5) window.scrollTo(0, current); raf = requestAnimationFrame(update); })();
    }
  </script>
